name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: ${{ matrix.node }}
          cache: true
          run-install: |
            args: ['--frozen-lockfile']
      - run: vp check
      - run: vp run typecheck
      - run: vp run test
        env:
          FUZZ_ITERS: "300000"
      - name: size gate (default entry must stay smaller than cnfast)
        run: vp run size

  freshness:
    # generated artifacts (vendored config, default tables) must match what the
    # committed compiler + tailwind-merge devDependency produce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: 24
          cache: true
          run-install: |
            args: ['--frozen-lockfile']
      - run: vp run build
      - run: vp run vendor-config
      - run: vp run compile-tables
      - run: git diff --exit-code packages/cn/src/default-config.generated.ts packages/cn/src/tables.generated.ts
