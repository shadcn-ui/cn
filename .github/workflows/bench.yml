name: Bench

# Non-gating: benchmarks on shared CI runners are directional, not decisive.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: 24
          cache: true
          run-install: |
            args: ['--frozen-lockfile']
      - run: vp run build
      - run: vp run bench
      - run: vp run bench:corpus
