name: Bench

# Non-gating: benchmarks on shared CI runners are directional, not decisive.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: node packages/conformance/bench/bench.mjs
      - run: node packages/conformance/bench/corpus.mjs
